<section class="sec">
  <header class="pagehead">
    <span class="pill"><a href="{{ .BaseURL }}/blog/">Блог</a>{{ if .FM.published_at }} · <time datetime="{{ .FM.published_at }}">{{ if .FM.date_label }}{{ .FM.date_label }}{{ else }}{{ .FM.published_at }}{{ end }}</time>{{ end }}</span>
    <h1 class="h1--article">{{ .Page.Title }}</h1>
    {{- if .FM.lead }}<p class="lead">{{ .FM.lead }}</p>{{ end }}
  </header>
  <article class="panel">
    <div class="prose">{{ .Body }}</div>
    <a class="sign" href="{{ .BaseURL }}/" title="На главную">
      <img class="sign__av" src="{{ .AssetsBase }}/vera-sm.jpg" width="34" height="34" alt="{{ .Settings.name }}" />
      <span><b>{{ .Settings.name }}</b><small>аналитические расклады на таро</small></span>
    </a>
  </article>
</section>
{{ template "cta.html" . }}
