<section class="sec sec--center">
  <header class="pagehead">
    <span class="orb">{{ template "icon-point" }}</span>
    <h1>Блог <em>о символах</em></h1>
    {{- if .FM.lead }}<p class="lead">{{ .FM.lead }}</p>{{ end }}
  </header>
  <div class="cards cards--list">
    {{- range .Collections.posts_all.Items }}
    <a class="card" href="{{ printf "%s%s" $.BaseURL .PublicPath }}">
      {{- if .FM.date_label }}<span class="card__date">{{ .FM.date_label }}</span>{{ end }}
      <span class="card__title">{{ .Title }}</span>
      <span class="card__text">{{ .Description }}</span>
    </a>
    {{- end }}
  </div>
</section>
{{ template "cta.html" . }}
