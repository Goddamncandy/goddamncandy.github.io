<article class="sec">
  <div class="wrap narrow">
    <header class="pagehead">
      {{- if .FM.kicker }}<span class="kicker">{{ .FM.kicker }}</span>{{ end }}
      <h1>{{ .Page.Title }}</h1>
      {{- if .FM.lead }}<p class="lead">{{ .FM.lead }}</p>{{ end }}
    </header>
    <div class="prose">{{ .Body }}</div>
  </div>
</article>
{{ template "cta.html" . }}
