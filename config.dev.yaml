# Для просмотра у себя: те же настройки, адреса — локальные. scripts/preview.sh
site:
  id: vera-site
  base_url: "http://127.0.0.1:8089"
  title: "Вера Ложкина — аналитические расклады на таро"
  description: "Расклады на таро как способ посмотреть на ситуацию иначе: через символы, в духе аналитической психологии Юнга. Ижевск и онлайн."
  default_og_image: "/assets/og/home.jpg"
  language: "ru"
  media_base_url: "http://127.0.0.1:8089/media"
  host: 127.0.0.1

runtime:
  mode: "dev"
  dev:
    base_url: "http://127.0.0.1:8089"
    media_base_url: "http://127.0.0.1:8089/media"

content:
  source: "local"
  local_dir: "./content"

markdown:
  html_policy: "safe"

# Разметка schema.org: WebSite и WebPage на каждой странице, Article у статей блога.
seo:
  jsonld: "auto"
  author_name: "Вера Ложкина"

# llms.txt — список страниц сайта для языковых моделей (llmstxt.org).
llms:
  enabled: true
  intro: "Вера Ложкина делает аналитические расклады на таро в духе Юнга: не гадание и не предсказание, а взгляд на ситуацию через символы. Расклад начинается с вопроса. Ижевск и онлайн."
  sections:
    - { type: "home", title: "Главная" }
    - { type: "page", title: "Расклад и метод" }
    - { type: "tool", title: "Инструмент" }
    - { type: "article", title: "Блог" }

og_type_by_type:
  home: "website"
  page: "website"
  blog: "website"
  article: "article"

paths:
  file_root: ./.notepub
  artifacts_dir: ./.notepub/artifacts
  snapshot_file: ./.notepub/snapshot/objects.json
  cache_root: ./.notepub/cache

theme:
  dir: .
  name: "theme"
  templates_subdir: templates
  assets_subdir: assets

server:
  listen: "127.0.0.1:8089"

rules_path: ./rules.yaml

# Слова и контакты, которые печатает шаблон. Тот же блок — в config.dev.yaml.
settings:
  name: "Вера Ложкина"
  city: "Ижевск"
  tg: "everveyra"            # личка для записи, без @
  channel: "everveyratarot"  # канал, без @
  price: "3 000 ₽"
  yandex_verification: "5672146a517756e7"   # Вебмастер, аккаунт Антона (добавлен 09.11.2026)
  metrika_id: ""                 # в локальной сборке не считаем
  closed: ""                 # пусто — сайт открыт для поиска (Вера утвердила тексты 02.11.2026); "yes" — закрыт и с плашкой «черновик»;
                             # закрыть снова — "yes" и "/" в robots ниже

robots:
  disallow: []

cache:
  html_ttl_seconds: 600
  stale_if_error_seconds: 604800
