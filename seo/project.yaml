# Генератор статей: настройка одного сайта. Общие правила — в коде (lifeos/articles_rules.md), здесь — своё.
# Реестр — clusters.yaml рядом, его ведёт `lifeos articles`.
name: "vera-site"
content: content            # страницы сайта, от папки сайта
exclude: []                 # папки внутри content, которые не страницы сайта (черновики, другой язык)
demand: required            # required — без замера в Вордстате бриф не выдаётся; optional — ключи по слову владельца
page_types:                 # виды страниц, которые пишет генератор: адрес и файл; {slug} и имена осей
  article: {permalink: "/blog/{slug}/", file: "blog/{slug}.md"}
cta:                        # куда ведёт призыв в конце страницы
  - slug: rasklad
    name: "Как проходит расклад"
    url: "/rasklad/"
  - slug: zapis
    name: "Записаться в Telegram"
    url: "https://t.me/everveyra"
facts:                      # факты сайта: цены, сроки, как работают — только подтверждённое владельцем (Антон, 02.11.2026)
  - "Вера Ложкина делает аналитические расклады на таро в духе аналитической психологии Юнга: не предсказание, а взгляд на ситуацию через символы."
  - "Платный расклад: 3 000 ₽, около часа, один большой вопрос или несколько небольших; очно в Ижевске или онлайн."
  - "Записаться — в Telegram: @everveyra. Канал: t.me/everveyratarot."
  - "Иногда Вера делает расклады в эзотерическом магазине «Тадж Махал» в Ижевске; когда она там, пишет в канале."
  - "Колоды: классическая (Уэйт), «Славянские легенды», «Чёрный гримуар», «Тёмный особняк», Манара. Колоду Вера выбирает по настроению."
  - "Первая часть встречи — поиск вопроса: пока человек формулирует, ответ часто появляется сам."
facts_files: ["../vera-life/projects/method.md"]   # метод Веры: идеи книги Анурова и Масловой «Архетип счастья»
rules: |                    # свои правила текста: голос, читатель, о чём нельзя — дописываются к общим
  Пишет Вера, от первого лица, спокойно и без нажима. Читатель — человек, который ищет ответ у карт и ещё не знает,
  что начинать стоит с вопроса. Карты не предсказывают и не решают за человека: никаких обещаний судьбы, сроков,
  «точно сбудется». Юнг и книга Анурова и Масловой — опора, а не авторитет для давления; цитаты короткие и с источником.
  Без эзотерического жаргона (энергии, чистки, порча). Примеры — обобщённые, без узнаваемых людей.
stop: [лучший, лучшие, №1, номер один, 100%, гарантируем результат, порча, приворот, снятие порчи, точно сбудется]
stop_vault: []              # списки стоп-слов из lifeos.yaml хранилища, например [timeline_stop] — имена заказчиков
# Сетки — когда страницы рождаются из сочетаний списков. Пример — «город × услуга»:
# axes:
#   service: [{slug: dezinfekciya, name: "Дезинфекция", phrases: ["дезинфекция"], facts: []}]
#   city: {regions: true, values: [{slug: izhevsk, name: "Ижевск", region: 44, facts: []}]}
# grids:
#   - {type: city_service, axes: [city, service], id: "{city}-{service}", cta: "{service}"}
# page_types:
#   city_service: {permalink: "/{city}/{service}/", file: "{city}/{service}.md"}
